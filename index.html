<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUST Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="page-container">
        <section class="auth-card">
            <img src="must-logo.png" alt="MUST university logo" class="university-logo">
            <h2>MBARARA UNIVERSITY OF SCIENCE AND TECHNOLOGY</h2>
            <p class="portal-name">Student Application Portal</p>

            <p class="eyebrow">WELCOME BACK</p>
            <h1>Sign in to your account</h1>
            <p class="help-text">Use your university email address to continue.</p>

            <form action="#" method="post">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="student@must.ac.ug" required>

                <div class="password-row">
                    <label for="password">Password</label>
                    <a href="#">Forgot password?</a>
                </div>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>

                <button type="submit">Sign in</button>
            </form>

            <p class="switch-text">Do not have an account? <a href="create-account.html">Create account</a></p>
            <p class="footer-text">MUST ICT Services · Secure student access</p>
        </section>
    </main>
</body>
</html>
